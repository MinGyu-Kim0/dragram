name: 기능 제안
description: 추가하거나 개선할 사용자 기능을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 누가 어떤 상황에서 불편을 겪는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작과 이번에 포함할 범위를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 기능이 완성됐음을 확인할 수 있는 조건을 적어 주세요.
      placeholder: |
        - [ ] 사용자가 ... 할 수 있다.
        - [ ] ... 상황에서도 정상 동작한다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 화면, 대안, 이슈 링크가 있으면 적어 주세요.
