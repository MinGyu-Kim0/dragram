name: 작업
description: 개발, 리팩터링, 문서, CI 등 필요한 작업을 기록합니다.
title: "[Task] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 왜 이 작업이 필요한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 작업에서 변경할 내용을 적어 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 어떤 결과나 검사로 완료를 확인할지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 관련 이슈 및 의존성
      description: 먼저 완료돼야 하는 작업이나 참고할 이슈가 있으면 적어 주세요.
