name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 폴더를 찾아, 해당 job만 돌린다.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      compose: ${{ steps.filter.outputs.compose }}
      workflows: ${{ steps.filter.outputs.workflows }}
      e2e: ${{ steps.filter.outputs.e2e }}
      e2e_key: ${{ steps.e2e_key.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # dev·main push는 직전 커밋과 비교한다. PR은 비워 두면 PR 대상 브랜치와 비교한다.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            extension:
              - 'extension/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'compose.yaml'
              - 'infra/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
            e2e:
              - 'e2e/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
      # E2E는 실제 OpenAI를 부른다. 시크릿이 없는 실행(등록 전, Dependabot PR 등)은 E2E를 건너뛴다.
      - name: Check E2E key
        id: e2e_key
        env:
          KEY: ${{ secrets.OPENAI_API_KEY_E2E }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OPENAI_API_KEY_E2E 시크릿이 없어 E2E를 건너뛴다."
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dragram
          POSTGRES_USER: dragram
          POSTGRES_PASSWORD: dragram-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragram -d dragram"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # 분석 작업 큐·작업자 소식(#98)
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: dragram
      POSTGRES_USER: dragram
      POSTGRES_PASSWORD: dragram-ci-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Django check
        run: uv run python manage.py check
      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest
      - name: Build production image
        run: docker build --target prod -t dragram-backend:ci .

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate development compose file
        run: docker compose config -q
      - name: Validate production compose file
        run: |
          printf 'SITE_ADDRESS=example.invalid\nPOSTGRES_PASSWORD=dragram-ci-only\n' > infra/.env
          docker compose --env-file infra/.env -f infra/compose.yaml config -q

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # 기본 사용 시나리오를 빌드한 확장을 올린 크롬에서 재생한다(#397). 실제 OpenAI를 부른다.
  e2e:
    needs: changes
    # dev·main push는 PR에서 이미 돌았으므로 다시 부르지 않는다(실제 API 비용).
    if: >-
      needs.changes.outputs.e2e_key == 'true' && github.event_name != 'push' && (
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Typecheck
        working-directory: e2e
        run: npm ci && npm run typecheck
      # 로컬처럼 .env.example(모델 이름 등)을 바탕으로 키만 넣는다.
      - name: Write .env
        env:
          KEY: ${{ secrets.OPENAI_API_KEY_E2E }}
        run: |
          grep -v '^OPENAI_API_KEY=' .env.example > .env
          printf 'OPENAI_API_KEY=%s\n' "$KEY" >> .env
      - name: E2E
        env:
          E2E_PROJECT: dragram-e2e-${{ github.run_id }}
        run: e2e/run.sh
      - name: Upload E2E results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
