name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-tests:
    name: Workflow diagnostic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test Claude failure diagnostics
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "true"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build backend and start PostgreSQL
        run: |
          docker compose -p dragram-ci build backend
          docker compose -p dragram-ci up -d --wait --wait-timeout 120 db
      - name: Check Django configuration and migrations
        run: |
          docker compose -p dragram-ci run --rm backend uv run --frozen python manage.py check
          docker compose -p dragram-ci run --rm backend uv run --frozen python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: docker compose -p dragram-ci run --rm backend uv run --frozen python manage.py test core
      - name: Clean up test containers and data
        if: always()
        run: docker compose -p dragram-ci down --volumes --remove-orphans

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
