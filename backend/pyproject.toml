[project]
name = "dragram-backend"
version = "0.1.0"
description = "Dragram API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "google-auth[requests]>=2.40",
    "gunicorn>=23",
    "openai>=3.35.1",
    "psycopg[binary]>=3.2",
    "sudachidict-core>=20261015",
    "sudachipy>=0.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
