[project]
name = "dragram-backend"
version = "0.1.0"
description = "Dragram API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "google-auth[requests]>=2.40",
    "openai>=3.35.1",
    "psycopg[binary]>=3.2",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sudachidict-core>=20261015",
    "sudachipy>=0.7.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# 멈춘 테스트가 대기 상한(분석 대기 130초 등)까지 기다리지 않고, 멈춘 자리를 보여 주며 실패하게 한다.
timeout = 10
