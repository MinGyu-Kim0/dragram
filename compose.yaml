name: dragram

x-backend-service: &backend-service
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-dev-only-change-me}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    DB_ENGINE: postgres
    POSTGRES_DB: ${POSTGRES_DB:-dragram}
    POSTGRES_USER: ${POSTGRES_USER:-dragram}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dragram-dev-only}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dragram}
      POSTGRES_USER: ${POSTGRES_USER:-dragram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dragram-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dragram} -d ${POSTGRES_DB:-dragram}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-service
    command: sh -c "uv run --frozen python manage.py migrate && uv run --frozen python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
