name: dragram

# 로컬 개발용. 값은 모두 개발 전용이며 운영에서 쓰지 않는다.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dragram
      POSTGRES_USER: dragram
      POSTGRES_PASSWORD: dragram-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragram -d dragram"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    # 마운트한 폴더에 만든 파일(마이그레이션 등)이 root 소유가 되지 않게 한다.
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: dev-only-not-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_DB: dragram
      POSTGRES_USER: dragram
      POSTGRES_PASSWORD: dragram-dev-only
      POSTGRES_HOST: db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    env_file:
      - path: .env
        required: false
    environment:
      # 개발 서버가 /api를 백엔드로 넘긴다(웹과 API를 같은 출처로).
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./web:/app
      # 이미지에 설치한 node_modules를 쓴다. 의존성을 바꾸면 build 후 `up -V`로 다시 만든다.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
