# E2E 전용 덮어쓰기(e2e/run.sh). 루트 compose.yaml 위에 겹친다.
# 실행마다 compose 프로젝트를 따로 두고 호스트 포트를 열지 않아, 개발 스택·다른 실행과 겹치지 않는다.
services:
  backend:
    ports: !reset []
    environment:
      # 웹 세션은 dev-login으로 만든다(DEBUG일 때만 열린다).
      DEV_LOGIN_ENABLED: "true"
    volumes:
      - ./e2e/fixtures:/e2e-fixtures:ro

  web:
    ports: !reset []

  # Playwright(크롬 + 빌드한 확장). e2e/run.sh가 `run`으로만 띄운다.
  e2e:
    profiles: [e2e]
    # @playwright/test와 같은 버전이어야 한다(e2e/package.json).
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      CI: ${CI:-}
    working_dir: /repo/e2e
    volumes:
      - .:/repo
    entrypoint: ["sh", "support/in-container.sh"]
    depends_on:
      - backend
      - worker
      - web
